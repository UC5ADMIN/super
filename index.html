<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UC5 Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     DESIGN TOKENS
     Seed idea: saddle-leather brown as primary (ties to UC5's
     leather goods business), charcoal-navy as secondary (gives
     it the "ops console" seriousness), warm parchment surfaces
     instead of stark white/gray so it doesn't read as a generic
     admin template.
     ============================================================ */
  :root {
    --primary: #8B5A2B;
    --primary-hover: #744A22;
    --primary-container: #F3E3CF;
    --on-primary-container: #4A2F13;

    --secondary: #2F3B4C;
    --secondary-container: #E4E8ED;

    --success: #3D8361;
    --warning: #C97B2E;
    --error: #B3261E;
    --error-container: #FBEAE8;

    --surface: #FFFFFF;
    --surface-variant: #F6F2EA;
    --surface-raised: #FFFFFF;
    --outline: #DED6C7;
    --outline-strong: #C7BCA6;

    --on-surface: #1C1B19;
    --on-surface-muted: #6B6459;

    --font-ui: 'Inter', system-ui, sans-serif;
    --font-brand: 'Sora', system-ui, sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;

    --shadow-1: 0 1px 2px rgba(28,27,25,0.06), 0 1px 3px rgba(28,27,25,0.08);
    --shadow-2: 0 4px 12px rgba(28,27,25,0.10);

    --sidebar-w: 248px;
    --sidebar-w-collapsed: 76px;
    --topbar-h: 64px;
  }

  html[data-theme="dark"] {
    --primary: #D9A15C;
    --primary-hover: #E5B372;
    --primary-container: #4A3416;
    --on-primary-container: #F3E3CF;

    --secondary: #A9B7C8;
    --secondary-container: #26303D;

    --success: #63C793;
    --warning: #E5A052;
    --error: #F2867B;
    --error-container: #402221;

    --surface: #14151A;
    --surface-variant: #1D1F26;
    --surface-raised: #1A1C22;
    --outline: #33353E;
    --outline-strong: #454854;

    --on-surface: #ECEAE5;
    --on-surface-muted: #9A9A94;

    --shadow-1: 0 1px 2px rgba(0,0,0,0.35);
    --shadow-2: 0 4px 16px rgba(0,0,0,0.45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font-ui);
    background: var(--surface-variant);
    color: var(--on-surface);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Layout shell ---------- */
  .app-shell { display: flex; height: 100vh; overflow: hidden; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--outline);
    display: flex;
    flex-direction: column;
    transition: width .2s ease;
  }
  .app-shell.collapsed .sidebar { width: var(--sidebar-w-collapsed); }

  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 20px 18px;
    border-bottom: 1px solid var(--outline);
  }
  .brand-mark {
    width: 38px; height: 38px;
    border-radius: var(--radius-sm);
    background: linear-gradient(135deg, var(--primary), var(--primary-hover));
    display: flex; align-items: center; justify-content: center;
    color: white; font-family: var(--font-brand); font-weight: 700; font-size: 15px;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }
  /* subtle leather-grain texture, restrained */
  .brand-mark::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,0.10) 0, transparent 40%),
      radial-gradient(circle at 75% 65%, rgba(255,255,255,0.08) 0, transparent 45%);
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.15; white-space: nowrap; overflow: hidden; }
  .brand-text strong { font-family: var(--font-brand); font-size: 15px; font-weight: 600; }
  .brand-text span { font-size: 11.5px; color: var(--on-surface-muted); font-family: var(--font-mono); letter-spacing: .02em; }
  .app-shell.collapsed .brand-text { display: none; }

  .nav { flex: 1; padding: 12px 10px; overflow-y: auto; }
  .nav-section-label {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--on-surface-muted); padding: 14px 10px 6px;
    font-weight: 600;
  }
  .app-shell.collapsed .nav-section-label { display: none; }

  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; margin: 2px 0;
    border-radius: var(--radius-sm);
    color: var(--on-surface);
    text-decoration: none;
    font-size: 14px; font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    position: relative;
  }
  .nav-item:hover { background: var(--surface-variant); }
  .nav-item.active { background: var(--primary-container); color: var(--on-primary-container); }
  .nav-item svg { flex-shrink: 0; width: 19px; height: 19px; }
  .app-shell.collapsed .nav-item span.label { display: none; }
  .app-shell.collapsed .nav-item { justify-content: center; }

  .status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    display: inline-block; margin-left: auto; flex-shrink: 0;
  }
  .status-dot.online { background: var(--success); box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 20%, transparent); }
  .status-dot.setup { background: var(--warning); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warning) 20%, transparent); }
  .app-shell.collapsed .status-dot { display: none; }

  .sidebar-footer { padding: 12px; border-top: 1px solid var(--outline); }
  .collapse-btn {
    width: 100%; display: flex; align-items: center; gap: 10px; justify-content: center;
    padding: 9px; border-radius: var(--radius-sm); border: 1px solid var(--outline);
    background: transparent; color: var(--on-surface-muted); cursor: pointer; font-size: 13px;
  }
  .collapse-btn:hover { background: var(--surface-variant); }

  /* ---------- Main column ---------- */
  .main-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }

  .topbar {
    height: var(--topbar-h); flex-shrink: 0;
    display: flex; align-items: center; gap: 16px;
    padding: 0 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--outline);
  }
  .breadcrumb { font-size: 13px; color: var(--on-surface-muted); font-family: var(--font-mono); }
  .breadcrumb strong { color: var(--on-surface); font-family: var(--font-ui); font-weight: 600; font-size: 15px; }

  .topbar-spacer { flex: 1; }

  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface-variant); border: 1px solid var(--outline);
    border-radius: 999px; padding: 8px 14px; width: 260px;
    color: var(--on-surface-muted); font-size: 13px;
  }
  .search-box input { border: none; background: transparent; outline: none; font-size: 13px; width: 100%; color: var(--on-surface); font-family: var(--font-ui); }

  .icon-btn {
    width: 38px; height: 38px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--outline); background: var(--surface); color: var(--on-surface);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--surface-variant); }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--secondary); color: white;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-brand); font-weight: 600; font-size: 13px;
  }

  /* ---------- Content area ---------- */
  .content { flex: 1; overflow: auto; }

  .dashboard { padding: 28px 32px 40px; max-width: 1180px; margin: 0 auto; }
  .dashboard-header { margin-bottom: 22px; }
  .dashboard-header h1 { font-family: var(--font-brand); font-size: 22px; margin: 0 0 4px; font-weight: 600; }
  .dashboard-header p { margin: 0; color: var(--on-surface-muted); font-size: 14px; }

  .stat-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 28px; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--outline); border-radius: var(--radius-md);
    padding: 16px 18px; box-shadow: var(--shadow-1);
  }
  .stat-card .stat-label { font-size: 12px; color: var(--on-surface-muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat-card .stat-value { font-family: var(--font-mono); font-size: 24px; font-weight: 500; margin-top: 4px; }

  .module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

  .module-card {
    background: var(--surface); border: 1px solid var(--outline); border-radius: var(--radius-lg);
    padding: 20px; box-shadow: var(--shadow-1); cursor: pointer;
    transition: box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    display: flex; flex-direction: column; gap: 12px;
  }
  .module-card:hover { box-shadow: var(--shadow-2); transform: translateY(-2px); border-color: var(--outline-strong); }

  .module-card-top { display: flex; align-items: flex-start; justify-content: space-between; }
  .module-icon {
    width: 42px; height: 42px; border-radius: var(--radius-sm);
    background: var(--primary-container); color: var(--on-primary-container);
    display: flex; align-items: center; justify-content: center;
  }
  .module-icon svg { width: 22px; height: 22px; }

  .pill {
    font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 5px;
  }
  .pill.online { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
  .pill.setup { background: color-mix(in srgb, var(--warning) 15%, transparent); color: var(--warning); }

  .module-card h3 { margin: 0; font-size: 16px; font-weight: 600; }
  .module-card p { margin: 0; font-size: 13px; color: var(--on-surface-muted); line-height: 1.45; flex: 1; }

  .module-card-footer { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; color: var(--on-surface-muted); font-family: var(--font-mono); }
  .open-link { color: var(--primary); font-weight: 600; font-family: var(--font-ui); font-size: 13px; }

  /* ---------- Module (iframe) view ---------- */
  .module-view { display: flex; flex-direction: column; height: 100%; }
  .module-toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--outline);
    flex-shrink: 0;
  }
  .module-toolbar .back-btn {
    display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500;
    color: var(--on-surface-muted); cursor: pointer; background: none; border: none; padding: 6px 8px; border-radius: var(--radius-sm);
  }
  .module-toolbar .back-btn:hover { background: var(--surface-variant); color: var(--on-surface); }
  .module-toolbar .title { font-weight: 600; font-size: 14px; margin-left: 4px; }
  .module-toolbar .toolbar-spacer { flex: 1; }

  .iframe-wrap { flex: 1; position: relative; background: var(--surface); }
  .iframe-wrap iframe { width: 100%; height: 100%; border: none; display: block; }

  .setup-notice {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; padding: 40px; color: var(--on-surface-muted); font-size: 14px;
  }
  .setup-notice code {
    font-family: var(--font-mono); background: var(--surface-variant); padding: 2px 8px; border-radius: 6px; font-size: 12.5px;
  }

  /* scrollbars, subtle */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--outline-strong); border-radius: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }

  @media (max-width: 860px) {
    .stat-row { grid-template-columns: repeat(2, 1fr); }
    .search-box { display: none; }
  }
</style>
</head>
<body>

<div class="app-shell" id="appShell">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">U5</div>
      <div class="brand-text">
        <strong>UC5 Ops Console</strong>
        <span>footwear &amp; leather goods</span>
      </div>
    </div>

    <nav class="nav" id="navList"></nav>

    <div class="sidebar-footer">
      <button class="collapse-btn" id="collapseBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 19l-7-7 7-7M18 19l-7-7 7-7"/></svg>
        <span id="collapseLabel">Collapse</span>
      </button>
    </div>
  </aside>

  <!-- ===================== MAIN COLUMN ===================== -->
  <div class="main-col">

    <header class="topbar">
      <div class="breadcrumb" id="breadcrumb"><strong>Dashboard</strong></div>
      <div class="topbar-spacer"></div>
      <div class="search-box">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input type="text" placeholder="Search modules…" id="searchInput">
      </div>
      <button class="icon-btn" id="themeToggle" title="Toggle theme">
        <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <div class="avatar">D</div>
    </header>

    <main class="content" id="content"></main>
  </div>
</div>

<script>
/* ============================================================
   MODULE CONFIG
   ------------------------------------------------------------
   Replace `url` with the live GitHub Pages / Apps Script web-app
   URL for each tool. Anything left as "" will show a "needs
   setup" state on its card instead of an empty iframe.
   Add new modules by adding another object to this array —
   the sidebar, dashboard and iframe viewer are all generated
   from this list, so nothing else needs to change.
   ============================================================ */
const MODULES = [
  {
    id: "payroll",
    name: "PayrollSheet",
    description: "Employee payroll, advances, attendance locking and balance tracking for UC5 Footwear staff.",
    url: "", // TODO: paste PayrollSheet web app URL
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>`
  },
  {
    id: "attendance",
    name: "Staff Attendance",
    description: "Tablet-based GPS-restricted clock-in/out with auto clock-out and daily status tracking.",
    url: "", // TODO: paste Attendance app URL
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`
  },
  {
    id: "labelforge",
    name: "LabelForge",
    description: "Browser-based label generator syncing to Google Sheets for product and shipment labels.",
    url: "", // TODO: paste LabelForge GitHub Pages URL
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l9 5v10l-9 5-9-5V7z"/><path d="M12 12l9-5M12 12v10M12 12L3 7"/></svg>`
  },
  {
    id: "inventory",
    name: "Finished Goods Inventory",
    description: "Online tracking of finished goods stock across warehouse, outlet and retail locations.",
    url: "https://uc5admin.github.io/onlinestock/",
    icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>`
  }
];

let activeModule = null; // null = dashboard
let sidebarCollapsed = false;

/* ---------- render sidebar ---------- */
function renderNav() {
  const nav = document.getElementById('navList');
  let html = `<div class="nav-section-label">Overview</div>
    <div class="nav-item ${activeModule === null ? 'active' : ''}" onclick="goTo(null)">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
      <span class="label">Dashboard</span>
    </div>
    <div class="nav-section-label">Modules</div>`;

  MODULES.forEach(m => {
    const status = m.url ? 'online' : 'setup';
    html += `<div class="nav-item ${activeModule === m.id ? 'active' : ''}" onclick="goTo('${m.id}')">
      ${m.icon}
      <span class="label">${m.name}</span>
      <span class="status-dot ${status}"></span>
    </div>`;
  });

  nav.innerHTML = html;
}

/* ---------- render content ---------- */
function renderContent() {
  const content = document.getElementById('content');
  const breadcrumb = document.getElementById('breadcrumb');

  if (activeModule === null) {
    breadcrumb.innerHTML = `<strong>Dashboard</strong>`;
    const onlineCount = MODULES.filter(m => m.url).length;

    content.innerHTML = `
      <div class="dashboard">
        <div class="dashboard-header">
          <h1>Good to see you, Dipak</h1>
          <p>One place for every UC5 tool — pick a module below to open it.</p>
        </div>

        <div class="stat-row">
          <div class="stat-card"><div class="stat-label">Modules</div><div class="stat-value">${MODULES.length}</div></div>
          <div class="stat-card"><div class="stat-label">Live</div><div class="stat-value">${onlineCount}</div></div>
          <div class="stat-card"><div class="stat-label">Needs setup</div><div class="stat-value">${MODULES.length - onlineCount}</div></div>
          <div class="stat-card"><div class="stat-label">Theme</div><div class="stat-value" style="font-size:15px;text-transform:capitalize;">${document.documentElement.getAttribute('data-theme')}</div></div>
        </div>

        <div class="module-grid">
          ${MODULES.map(m => `
            <div class="module-card" onclick="goTo('${m.id}')">
              <div class="module-card-top">
                <div class="module-icon">${m.icon}</div>
                <span class="pill ${m.url ? 'online' : 'setup'}">
                  <span class="status-dot ${m.url ? 'online' : 'setup'}" style="margin:0;"></span>
                  ${m.url ? 'Online' : 'Needs URL'}
                </span>
              </div>
              <h3>${m.name}</h3>
              <p>${m.description}</p>
              <div class="module-card-footer">
                <span>#${m.id}</span>
                <span class="open-link">Open →</span>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  } else {
    const m = MODULES.find(x => x.id === activeModule);
    breadcrumb.innerHTML = `Dashboard / <strong>${m.name}</strong>`;

    content.innerHTML = `
      <div class="module-view">
        <div class="module-toolbar">
          <button class="back-btn" onclick="goTo(null)">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Dashboard
          </button>
          <span class="title">${m.name}</span>
          <div class="toolbar-spacer"></div>
          ${m.url ? `
            <button class="icon-btn" title="Refresh" onclick="reloadFrame()">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0114.5-3.5L23 10M1 14l5 4.5A9 9 0 0020.5 15"/></svg>
            </button>
            <button class="icon-btn" title="Open in new tab" onclick="window.open('${m.url}', '_blank')">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6M10 14L21 3"/></svg>
            </button>
          ` : ''}
        </div>
        <div class="iframe-wrap">
          ${m.url
            ? `<iframe id="moduleFrame" src="${m.url}" title="${m.name}"></iframe>`
            : `<div class="setup-notice">
                 <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16h.01"/></svg>
                 <div><strong>${m.name} isn't wired up yet.</strong></div>
                 <div>Set its live URL in the <code>MODULES</code> config near the top of the script, against <code>id: "${m.id}"</code>.</div>
               </div>`
          }
        </div>
      </div>
    `;
  }
}

function goTo(id) {
  activeModule = id;
  renderNav();
  renderContent();
}

function reloadFrame() {
  const f = document.getElementById('moduleFrame');
  if (f) f.src = f.src;
}

/* ---------- theme toggle ---------- */
document.getElementById('themeToggle').addEventListener('click', () => {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  html.setAttribute('data-theme', next);
  if (activeModule === null) renderContent(); // refresh the "theme" stat card
});

/* ---------- sidebar collapse ---------- */
document.getElementById('collapseBtn').addEventListener('click', () => {
  sidebarCollapsed = !sidebarCollapsed;
  document.getElementById('appShell').classList.toggle('collapsed', sidebarCollapsed);
  document.getElementById('collapseLabel').textContent = sidebarCollapsed ? 'Expand' : 'Collapse';
});

/* ---------- basic search filter (dashboard only) ---------- */
document.getElementById('searchInput').addEventListener('input', (e) => {
  if (activeModule !== null) return;
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('.module-card').forEach(card => {
    const name = card.querySelector('h3').textContent.toLowerCase();
    card.style.display = name.includes(q) ? '' : 'none';
  });
});

/* ---------- init ---------- */
renderNav();
renderContent();
</script>

</body>
</html>
